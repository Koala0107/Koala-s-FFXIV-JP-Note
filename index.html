  --accent-fg: #07222c;
  --accent-soft: #163543;
  --pink: #f5b3cf;
  --pink-soft: #3a2230;
  --gold: #e6b254;
  --gold-soft: #3a2f17;
  --danger: #ff8f86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ko);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
.wrap { max-width: 1480px; margin: 0 auto; }
header.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 16px 10px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-jp); font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.logo { width: 52px; height: 52px; image-rendering: pixelated; flex: none; margin-right: -4px; }
.brand h1 { flex: 1 1 auto; min-width: 0; }
.labelform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 10px; }
.labelform .lf-t { font-size: 12.5px; color: var(--muted); }
.labelform input { width: 7em; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; }
.sub { color: var(--muted); font-size: 12.5px; }
.search { margin-top: 12px; position: relative; }
.search input {
  width: 100%;
  font: inherit;
  font-size: 16px;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 40px 11px 12px;
}
.search input::placeholder { color: var(--muted); }
.search input:focus-visible, button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search .clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted);
  font-size: 18px; cursor: pointer; border-radius: 6px;
}
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tabs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  font: inherit; font-size: 14px; font-weight: 500;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
  white-space: nowrap;
}
.tab[aria-selected="true"], .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tab .n { opacity: 0.75; font-weight: 400; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
@media (max-width: 700px) { .chips { max-height: 7.5rem; overflow-y: auto; } }
.chip {
  flex: 0 0 auto;
  font: inherit; font-size: 13px;
  color: var(--fg);
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 4px 11px;
  cursor: pointer;
  white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.statusbar { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; }
.status { margin: 0; font-size: 13px; color: var(--muted); }
.group-title {
  margin: 22px 0 8px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 6px 10px 14px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  font: inherit;
  color: inherit;
}
.row:hover { border-color: var(--accent); }
.row.copied { border-color: var(--accent); background: var(--accent-soft); }
.txt { min-width: 0; }
.txt { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.jp, .ko, .yomi { max-width: 100%; padding: 3px 9px; border-radius: 8px; overflow-wrap: anywhere; }
.jp { font-family: var(--font-jp); font-size: 17px; font-weight: 500; line-height: 1.4; background: var(--surface-2); }
.ko { color: var(--muted); font-size: 13.5px; background: var(--accent-soft); }
.yomi { font-size: 12px; color: var(--pink); background: var(--pink-soft); }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.fill { background: var(--gold-soft); color: var(--gold); font-weight: 700; }
.acts { display: flex; flex-direction: column; align-items: center; }
.star {
  width: 40px; height: 40px; border: 0; background: transparent; cursor: pointer;
  font-size: 19px; line-height: 1; color: var(--muted); border-radius: 8px;
}
.star[aria-pressed="true"] { color: var(--gold); }
.row.editable { border-style: dashed; }
.hint { font-size: 12px; color: var(--muted, #888); min-height: 1em; margin-top: 4px; }
.draggable { cursor: grab; }
.dragging { opacity: 0.4; }
.drop-over { outline: 2px solid var(--accent); outline-offset: 2px; }
.list.drop-over { outline: 2px dashed var(--accent); outline-offset: 6px; }
.btn { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.btn.danger, .mini.danger { color: var(--danger); }
.mini { font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; letter-spacing: 0; font-weight: 500; }
.editor { grid-column: 1 / -1; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 8px; padding: 12px; display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.editor label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.editor input, .nameform input { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; }
.editor .btns { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.nameform { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
.nameform input { flex: 1 1 200px; width: auto; }
.addcard { font: inherit; font-size: 14px; border: 1.5px dashed var(--line); background: transparent; color: var(--muted); border-radius: 8px; min-height: 64px; cursor: pointer; }
.addcard:hover { border-color: var(--accent); color: var(--accent); }
.tab.addtab, .chip.addchip { border-style: dashed; color: var(--accent); background: transparent; }
.chips .nameform { flex: 1 0 300px; }
.gt-toggle { font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); background: transparent; border: 0; padding: 4px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.gt-toggle .chev { display: inline-block; width: 1em; color: var(--muted); }
.gt-n { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(20px);
  background: var(--fg); color: var(--bg);
  padding: 9px 16px; border-radius: 8px;
  font-size: 14px; max-width: calc(100vw - 32px);
  opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s;
  z-index: 20; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
footer p { margin: 0 0 6px; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 1099px) { .list { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 759px) { .list { grid-template-columns: repeat(2, minmax(0, 1fr)); } .editor { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 479px) { .list { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 420px) { h1 { font-size: 20px; } .jp { font-size: 16px; } }
</style>

function seedCats() {
  var out = [], ti = -1, ci = 0, tabName = "", c = null;
  RAW.split("\n").forEach(function (line) {
    line = line.trim();
    if (!line) return;
    if (line.indexOf("#T ") === 0) { ti++; ci = 0; tabName = line.slice(3).trim(); return; }
    if (line.indexOf("#C ") === 0) {
      c = { id: "t" + ti + "c" + ci, tab: tabName, cat: line.slice(3).trim(), order: ti * 1000 + ci, items: [] };
      ci++;
      out.push(c);
      return;
    }
    var p = line.split(" | ");
    if (p.length < 2 || !c) return;
    c.items.push({ jp: p[0].trim(), ko: p[1].trim(), yomi: (p[2] || "").trim() });
  });
  return out;
}

var state = { tab: "", cat: "", q: "" };

var toastTimer = 0;

function derive() {
  tabs = []; items = [];
  cats.forEach(function (c) {
    var t = tabs.filter(function (x) { return x.name === c.tab; })[0];
    if (!t) { t = { name: c.tab, cats: [] }; tabs.push(t); }
    t.cats.push(c);
    c.items.forEach(function (src) {
      items.push({
        jp: src.jp, ko: src.ko, yomi: src.yomi || "",
        tab: c.tab, cat: c.cat, catRef: c, src: src,
        id: src.jp + "¦" + src.ko,
        fill: FILL.test(src.jp),
        key: norm(src.jp + src.ko + (src.yomi || "") + c.cat)
      });
    });
  });
  if (state.tab !== FAV_TAB && !tabs.some(function (t) { return t.name === state.tab; })) {
    state.tab = tabs.length ? tabs[0].name : "";
    state.cat = "";
  }
  if (state.cat) {
    var cur = tabs.filter(function (t) { return t.name === state.tab; })[0];
    if (!cur || !cur.cats.some(function (c) { return c.id === state.cat; })) state.cat = "";
  }
}
derive();

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2400);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
  }
  return legacyCopy(text);
}
function legacyCopy(text) {
  return new Promise(function (resolve, reject) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error("copy failed"));
  });
}

function el(tag, cls, text) {

/* ---------- 저장 ---------- */
var chains = {};
function queue(id, fn) {
  chains[id] = (chains[id] || Promise.resolve()).then(fn).then(function () { toast("저장했어요"); }, function () {
    toast("저장하지 못했어요. 새로고침한 뒤 다시 시도해 주세요");
  });
}
function persist(c) {
  var body = {
    tab: c.tab, cat: c.cat, order: c.order,
    items: c.items.map(function (x) { return { jp: x.jp, ko: x.ko, yomi: x.yomi || "" }; })
  };
  queue(c.id, function () { return DB.doc("cats/" + c.id).set(body); });
}
function removeCat(c) {
  cats.splice(cats.indexOf(c), 1);
  queue(c.id, function () { return DB.doc("cats/" + c.id).delete(); });
}

function startEditing(obj) { editing = obj; focusNext = true; render(); }

var sampleOK = false, sampleDead = false;
var YOMI_ERR = { not_granted: "Claude 사용을 허용하지 않아 자동 입력을 쓸 수 없어요", rate_limited: "잠시 후 다시 눌러 주세요", session_expired: "다시 로그인해 주세요", invalid_json: "읽기를 만들지 못했어요. 다시 눌러 주세요", upstream_error: "연결이 불안정해요. 다시 눌러 주세요" };
function autoYomi(jp, input, status, quiet) {
  if (!jp) return Promise.resolve();
  status.textContent = "읽는 중…";
  return claude.use("sample").then(function (sample) {
    if (!sample) { sampleDead = true; status.textContent = "이 화면에서는 자동 입력을 쓸 수 없어요"; return; }
    var prompt = "다음 일본어 문장/단어의 발음을 한국어 한글 표기로 적어 주세요. 일본어 외래 발음 표기 방식(예: よろしくお願いします → 요로시쿠 오네가이시마스, お疲れ様です → 오츠카레사마데스)처럼, 띄어쓰기는 의미 단위로 하고, 한자는 문맥에 맞는 읽기로 읽으세요. 영문 약어(PT, IL 등)는 일본어식으로 읽으세요(PT→피티). 설명 없이 JSON만: {\"reading\": \"...\"}\n\n" + jp;
    return sample.json(prompt, { modelTier: "quick" }).then(function (res) {
      var v = res && typeof res.reading === "string" ? res.reading.trim() : "";
      if (!v) { status.textContent = "읽기를 만들지 못했어요"; return; }
      if (quiet && input.value.trim()) { status.textContent = ""; return; }
      input.value = v; sampleOK = true; status.textContent = "자동 입력됨 · 필요하면 고쳐 주세요";
    });
  }).catch(function (e) {
    var code = e && e.code;
    if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled") sampleDead = true;
    status.textContent = YOMI_ERR[code] || "자동 입력에 실패했어요";
  });
}
function entryEditor(src, c) {
  var box = el("div", "editor");
  box.appendChild(field("ed-jp", "일본어", src ? src.jp : "", "예: よろしくお願いします"));
  box.appendChild(field("ed-ko", "한국어", src ? src.ko : "", "예: 잘 부탁드립니다"));
  box.appendChild(field("ed-yomi", "읽기 (선택)", src ? src.yomi : "", "예: 요로시쿠 오네가이시마스"));
  var yomiIn = box.querySelector("#ed-yomi"), jpIn = box.querySelector("#ed-jp");
  var yStatus = el("div", "hint");
  var yBtn = btn("읽기 자동 입력", "btn", function () {
    yBtn.disabled = true;
    autoYomi(jpIn.value.trim(), yomiIn, yStatus, false).then(function () { yBtn.disabled = false; });
  });
  yomiIn.parentNode.appendChild(yStatus);
  jpIn.addEventListener("blur", function () {
    if (sampleOK && !sampleDead && !yomiIn.value.trim() && jpIn.value.trim()) autoYomi(jpIn.value.trim(), yomiIn, yStatus, true);
  });
  var btns = el("div", "btns");
  function doSave() {
    var jp = $("ed-jp").value.trim(), ko = $("ed-ko").value.trim(), yomi = $("ed-yomi").value.trim();
    if (!jp || !ko) { toast("일본어와 한국어를 모두 입력해 주세요"); return; }
    if (src) { src.jp = jp; src.ko = ko; src.yomi = yomi; }
    else c.items.push({ jp: jp, ko: ko, yomi: yomi });
    persist(c);
    closeEditor();
  }
  btns.appendChild(btn("저장", "btn primary", doSave));
  btns.appendChild(yBtn);
  btns.appendChild(btn("취소", "btn", closeEditor));
  if (src) {
    var armed = false, del = btn("삭제", "btn danger", function () {
      if (!armed) {
        armed = true; del.textContent = "한 번 더 누르면 삭제돼요";
        setTimeout(function () { armed = false; del.textContent = "삭제"; }, 3000);
        return;
      }
      c.items.splice(c.items.indexOf(src), 1);
      persist(c);
      closeEditor();

    btns.appendChild(del);
  }
  box.appendChild(btns);
  box.addEventListener("keydown", function (ev) {

function nameForm(initial, onSave, ph) {

/* ---------- 끌어서 이동 ---------- */
var dragState = null;
function clearDropMarks() {
  var n = document.querySelectorAll(".drop-over");
  for (var i = 0; i < n.length; i++) n[i].classList.remove("drop-over");
}
function makeDraggable(node, info) {
  if (!editUI() || editing) return;
  node.draggable = true;
  node.classList.add("draggable");
  node.addEventListener("dragstart", function (ev) {
    ev.stopPropagation();
    dragState = info;
    ev.dataTransfer.effectAllowed = "move";
    try { ev.dataTransfer.setData("text/plain", "ff14jp"); } catch (e) {}
    node.classList.add("dragging");
  });
  node.addEventListener("dragend", function () {
    dragState = null;
    node.classList.remove("dragging");
    clearDropMarks();
  });
}
function makeDropTarget(node, type, onDrop) {
  if (!editUI()) return;
  node.addEventListener("dragover", function (ev) {
    if (!dragState || dragState.type !== type) return;
    ev.preventDefault();
    ev.stopPropagation();
    ev.dataTransfer.dropEffect = "move";
    node.classList.add("drop-over");
  });
  node.addEventListener("dragleave", function (ev) {
    if (!node.contains(ev.relatedTarget)) node.classList.remove("drop-over");
  });
  node.addEventListener("drop", function (ev) {
    if (!dragState || dragState.type !== type) return;
    ev.preventDefault();
    ev.stopPropagation();
    var d = dragState;
    dragState = null;
    clearDropMarks();
    onDrop(d);
  });
}
function sortCats() { cats.sort(function (a, b) { return a.order - b.order; }); }
function moveItem(d, to, beforeSrc) {
  var from = d.c;
  var idx = from.items.indexOf(d.src);
  if (idx < 0 || beforeSrc === d.src) return;
  from.items.splice(idx, 1);
  var at = beforeSrc ? to.items.indexOf(beforeSrc) : to.items.length;
  if (at < 0) at = to.items.length;
  to.items.splice(at, 0, d.src);
  persist(from);
  if (to !== from) persist(to);
  render();
}
function moveCat(d, target) {
  var t = tabs.filter(function (x) { return x.name === d.c.tab; })[0];
  if (!t) return;
  if (target && (target === d.c || target.tab !== d.c.tab)) return;
  var list = t.cats.filter(function (c) { return c !== d.c; });
  var at = target ? list.indexOf(target) : list.length;
  list.splice(at, 0, d.c);
  var base = Math.floor(Math.min.apply(null, t.cats.map(function (c) { return c.order; })) / 1000) * 1000;
  list.forEach(function (c, i) {
    var o = base + i;
    if (c.order !== o) { c.order = o; persist(c); }
  });
  sortCats();
  render();
}
function moveTab(d, targetName) {
  if (targetName === d.name) return;
  var names = tabs.map(function (t) { return t.name; }).filter(function (n) { return n !== d.name; });
  var at = targetName ? names.indexOf(targetName) : names.length;
  names.splice(at, 0, d.name);
  names.forEach(function (n, ti) {
    var t = tabs.filter(function (x) { return x.name === n; })[0];
    t.cats.forEach(function (c, ci) {
      var o = ti * 1000 + ci;
      if (c.order !== o) { c.order = o; persist(c); }
    });
  });
  sortCats();
  render();
}

/* ---------- 화면 ---------- */
function makeRow(it, showTab) {
  var row = el("div", "row" + (editUI() ? " editable" : ""));
  row.setAttribute("role", "button");
  row.tabIndex = 0;
  var txt = el("div", "txt");
  txt.appendChild(el("div", "jp", it.jp));
  txt.appendChild(el("div", "ko", (LABELS.ko ? LABELS.ko + ": " : "") + it.ko));
  if (it.yomi) txt.appendChild(el("div", "yomi", (LABELS.yomi ? LABELS.yomi + ": " : "") + it.yomi));
  if (it.fill || showTab) {
    var meta = el("div", "meta");
    if (showTab) meta.appendChild(el("span", "tag", it.tab + " · " + it.cat));
    if (it.fill) meta.appendChild(el("span", "tag fill", "빈칸 수정 필요"));
    txt.appendChild(meta);
  }
  var acts = el("div", "acts");
  var star = el("button", "star", favs[it.id] ? "★" : "☆");
  star.type = "button";
  star.setAttribute("aria-pressed", favs[it.id] ? "true" : "false");
  star.setAttribute("aria-label", "즐겨찾기");
  star.addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (favs[it.id]) delete favs[it.id]; else favs[it.id] = 1;
    saveFavs();
    if (state.tab === FAV_TAB) render(); else {
      star.textContent = favs[it.id] ? "★" : "☆";
      star.setAttribute("aria-pressed", favs[it.id] ? "true" : "false");
      renderTabs();
    }
  });
  acts.appendChild(star);
  row.appendChild(txt);
  row.appendChild(acts);
  function activate() {
    if (editUI()) { startEditing({ kind: "edit", src: it.src, c: it.catRef }); return; }
    copyText(it.jp).then(function () {
      row.classList.add("copied");
      setTimeout(function () { row.classList.remove("copied"); }, 900);
      toast(it.fill ? "복사했어요. ( ) 나 ？ 부분은 채팅창에서 바꿔 주세요" : "복사했어요");
    }, function () {
      toast("복사하지 못했어요. 글자를 길게 눌러 직접 복사해 주세요");
    });
  }
  row.addEventListener("click", activate);
  row.addEventListener("keydown", function (ev) {
    if (ev.target !== row) return;
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
  });
  if (editUI() && !showTab) {
    makeDraggable(row, { type: "item", src: it.src, c: it.catRef });
    makeDropTarget(row, "item", function (d) { moveItem(d, it.catRef, it.src); });
  }
  return row;
}

function favCount() { return Object.keys(favs).length; }

function renderTabs() {
  tabsEl.textContent = "";
  var names = tabs.map(function (t) { return t.name; });
  names.push(FAV_TAB);
  names.forEach(function (n) {
    var b = el("button", "tab");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", state.tab === n && !state.q ? "true" : "false");
    b.appendChild(document.createTextNode(n));
    var cnt = n === FAV_TAB ? favCount() : items.filter(function (i) { return i.tab === n; }).length;
    b.appendChild(el("span", "n", String(cnt)));
    b.addEventListener("click", function () {
      editing = null;
      state.tab = n; state.cat = "";
      if (state.q) { state.q = ""; qEl.value = ""; clearEl.hidden = true; }
      render();
      window.scrollTo(0, 0);
    });
    if (editUI() && n !== FAV_TAB) {
      makeDraggable(b, { type: "tab", name: n });
      makeDropTarget(b, "tab", function (d) { moveTab(d, n); });
    }
    tabsEl.appendChild(b);
  });
  if (editUI()) {
    var add = el("button", "tab addtab", "＋ 탭");
    add.type = "button";
    add.addEventListener("click", function () { startEditing({ kind: "newtab" }); });
    makeDropTarget(add, "tab", function (d) { moveTab(d, null); });
    tabsEl.appendChild(add);
  }
}

function curTab() { return tabs.filter(function (x) { return x.name === state.tab; })[0]; }

function saveNewTab(v) {
  if (tabs.some(function (t) { return t.name === v; })) { toast("같은 이름의 탭이 이미 있어요"); return; }
  var maxO = cats.reduce(function (m, c) { return Math.max(m, c.order); }, 0);
  var c = { id: "n" + Date.now().toString(36), tab: v, cat: "기본", order: (Math.floor(maxO / 1000) + 1) * 1000, items: [] };
  cats.push(c);
  persist(c);
  state.tab = v; state.cat = "";
  closeEditor();
}
function saveNewCat(v) {
  var t = curTab();
  if (!t) return;
  var orders = t.cats.map(function (c) { return c.order; });
  var c = { id: "n" + Date.now().toString(36), tab: t.name, cat: v, order: (orders.length ? Math.max.apply(null, orders) : 0) + 1, items: [] };
  cats.push(c);
  persist(c);
  state.cat = "";
  closeEditor();
}

function renderChips() {
  chipsEl.textContent = "";

    chipsEl.hidden = false;
    chipsEl.appendChild(nameForm("", saveNewTab, "새 탭 이름"));
    return;
  }
  if (state.q || state.tab === FAV_TAB) { chipsEl.hidden = true; return; }
  chipsEl.hidden = false;
  var t = curTab();
  if (!t) return;
  var all = el("button", "chip", "전체");
  all.type = "button";
  all.setAttribute("aria-pressed", state.cat === "" ? "true" : "false");
  all.addEventListener("click", function () { state.cat = ""; render(); });
  chipsEl.appendChild(all);
  t.cats.forEach(function (c) {
    var b = el("button", "chip", c.cat);
    b.type = "button";
    b.setAttribute("aria-pressed", state.cat === c.id ? "true" : "false");
    b.addEventListener("click", function () { state.cat = c.id; render(); });
    if (editUI()) {
      makeDraggable(b, { type: "cat", c: c });
      makeDropTarget(b, "cat", function (d) { moveCat(d, c); });
      makeDropTarget(b, "item", function (d) { moveItem(d, c, null); });
    }
    chipsEl.appendChild(b);
  });
  if (editUI()) {
    if (editing && editing.kind === "newcat") {
      chipsEl.appendChild(nameForm("", saveNewCat, "새 분류 이름"));

      add.addEventListener("click", function () { startEditing({ kind: "newcat" }); });
      makeDropTarget(add, "cat", function (d) { moveCat(d, null); });

    }
  }

      var nq = norm(state.q);
      list = items.filter(function (i) { return i.key.indexOf(nq) >= 0; });
      statusEl.textContent = prefix + "‘" + state.q + "’ 검색 결과 " + list.length + "개";
    } else {
      list = items.filter(function (i) { return favs[i.id]; });
      statusEl.textContent = list.length ? prefix + "즐겨찾기 " + list.length + "개" : "";
    }
    if (!list.length) {
      outEl.appendChild(el("div", "empty", state.q
        ? "찾는 말이 없어요. 한국어 뜻이나 일본어 일부로 다시 검색해 보세요."
        : "즐겨찾기가 비어 있어요. 문장 오른쪽 ☆를 누르면 여기에 모여요."));
      return;
    }
    var l = el("div", "list");
    list.forEach(function (it) {
      if (editing && editing.kind === "edit" && editing.src === it.src) l.appendChild(entryEditor(it.src, it.catRef));
      else l.appendChild(makeRow(it, true));
    });
    outEl.appendChild(l);
    return;
  }
  var t = curTab();
  if (!t) { statusEl.textContent = ""; return; }
  var shown = 0, groups = 0;
  t.cats.forEach(function (c) {
    if (state.cat && c.id !== state.cat) return;
    var rows = items.filter(function (i) { return i.catRef === c; });
    var isAdding = !!(editing && editing.kind === "add" && editing.c === c);
    if (!rows.length && !ui && !isAdding) return;
    shown += rows.length;
    groups++;
    if (!state.cat || ui) outEl.appendChild(groupTitle(c, ui, rows.length));
    var open = !!state.cat || !collapsed[c.id] || isAdding || !!(editing && editing.kind === "edit" && editing.c === c);
    if (!open) return;
    var l = el("div", "list");
    if (ui) makeDropTarget(l, "item", function (d) { moveItem(d, c, null); });
    rows.forEach(function (it) {
      if (editing && editing.kind === "edit" && editing.src === it.src) l.appendChild(entryEditor(it.src, c));
      else l.appendChild(makeRow(it, false));
    });
    if (isAdding) l.appendChild(entryEditor(null, c));
    else if (ui) l.appendChild(btn("＋ 문장 추가", "addcard", function () { startEditing({ kind: "add", c: c }); }));
    outEl.appendChild(l);
  });
  if (groups > 1 && !state.cat) {
    bulkEl.hidden = false;
    bulkEl.textContent = t.cats.every(function (c) { return collapsed[c.id]; }) ? "모두 펼치기" : "모두 접기";
  }
  statusEl.textContent = prefix + shown + "개";
  if (!shown && !ui) outEl.appendChild(el("div", "empty", "이 분류에는 아직 내용이 없어요."));
}

function render() {
  derive();
  renderTabs();
  renderChips();
  renderOut();
  if (focusNext) {
    focusNext = false;
    var f = $("ed-jp") || $("ed-cat");
    if (f) f.focus();
  }
}

/* ---------- 검색 ---------- */
var qTimer = 0;
qEl.addEventListener("input", function () {
  clearTimeout(qTimer);
  qTimer = setTimeout(function () {
    editing = null;
    state.q = qEl.value.trim();
    clearEl.hidden = !qEl.value;
    render();
  }, 120);
});
clearEl.addEventListener("click", function () {
  qEl.value = ""; state.q = ""; clearEl.hidden = true; render(); qEl.focus();
});

bulkEl.addEventListener("click", function () {
  var t = curTab();
  if (!t) return;
  var allCollapsed = t.cats.every(function (c) { return collapsed[c.id]; });
  t.cats.forEach(function (c) { if (allCollapsed) delete collapsed[c.id]; else collapsed[c.id] = 1; });
  saveCollapsed();
  render();
});

/* ---------- 편집 모드 / 공유 데이터 ---------- */
function updateEditBtn() { editToggle.hidden = !(canEditFlag && DB); }
editToggle.addEventListener("click", function () {
  editMode = !editMode;
  editing = null;
  editToggle.setAttribute("aria-pressed", editMode ? "true" : "false");
  editToggle.textContent = editMode ? "편집 끝내기" : "편집";
  if (pendingSnap) { cats = pendingSnap; pendingSnap = null; }
  render();
});

function applySnap(snap) {
  if (snap.empty) return;
  var next = snap.docs.map(function (d) {
    var x = d.data() || {};
    return {
      id: d.id, tab: String(x.tab || ""), cat: String(x.cat || ""), order: Number(x.order) || 0,
      items: (Array.isArray(x.items) ? x.items : []).map(function (it) {
        return { jp: String((it && it.jp) || ""), ko: String((it && it.ko) || ""), yomi: String((it && it.yomi) || "") };
      })
    };
  }).sort(function (a, b) { return a.order - b.order; });
  if (editing) { pendingSnap = next; return; }
  cats = next;
  render();
}

(function init() {
  render();
  if (!(window.claude && window.claude.use)) return;
  window.claude.use("user").then(function (u) { return u ? u.canEdit() : false; })
    .then(function (v) { canEditFlag = !!v; updateEditBtn(); }, function () {});
  window.claude.use("db").then(function (db) {
    if (!db) return;
    DB = db;
    updateEditBtn();
    db.collection("cats").onSnapshot(applySnap, function () {});
    db.doc("meta/labels").onSnapshot(function (s) {
      var x = s && s.exists ? s.data() : null;
      if (!x) return;
      LABELS = { ko: String(x.ko == null ? "번역" : x.ko), yomi: String(x.yomi == null ? "읽기" : x.yomi) };
      if (!editing) render();
    }, function () {});
  }, function () {});
})();
</script>
