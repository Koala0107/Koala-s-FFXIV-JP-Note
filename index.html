.site-pop .kana-pop-msg { font-size: 17px; line-height: 1.5; margin-bottom: 8px; white-space: nowrap; }
@media (max-width: 560px) { .site-pop .kana-pop-msg { white-space: normal; word-break: keep-all; font-size: 15.5px; } }
.site-pop-sub { margin: 0 0 16px; font-size: 15px; color: var(--muted); }
.site-pop-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.site-pop-yes, .site-pop-no { font: inherit; font-weight: 700; height: 44px; border-radius: 10px; cursor: pointer; }
.site-pop-yes { border: 0; background: #2f6bd8; color: #fff; }
.site-pop-yes:hover { background: #3d7cf0; }
.site-pop-no { border: 1px solid var(--line); background: transparent; color: var(--fg); }
.site-pop-no:hover { background: var(--surface-2); }
.kana-pop-ok:hover { background: #3d7cf0; }
.kana-note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 640px) { .kana-pad { grid-template-columns: minmax(0, 1fr); } .kana-info { min-height: 0; padding: 12px 10px; gap: 8px; } .kana-big { font-size: 56px; } .kana-big[data-n="2"] { font-size: 42px; } .kana-big[data-n="4"], .kana-big[data-n="5"] { font-size: 30px; } }
@media (max-width: 480px) { .kana-c { font-size: 20px; } .kana-grid { gap: 4px; } .kana-tts { width: 22px; height: 22px; } .kana-hb { padding: 0 10px; font-size: 13px; } .kana-title { font-size: 17px; white-space: normal; } }

  var rd = document.getElementById("rstD"), rd5 = document.getElementById("rstD5"), rw = document.getElementById("rstW"), lastD5 = "";
  function fmt(h, m, sec) { return (h < 12 ? "오전" : "오후") + "|" + p2(h % 12 || 12) + ":" + p2(m) + ":" + p2(sec); }

    var now = Date.now(), d = new Date(now);
    var l = fmt(d.getHours(), d.getMinutes(), d.getSeconds());
    var e = Math.floor(now * 3600 / 175 / 1000); /* 에오르제아 시간 = 실제 시간 × 3600/175 (하루 70분) */
    var t = fmt(Math.floor(e / 3600) % 24, Math.floor(e / 60) % 60, e % 60);
    if (l !== lastL) { set(lt, l); lastL = l; }
    if (t !== lastE) { set(et, t); lastE = t; }

      var u = new Date(now);
      var nd = Date.UTC(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), 15, 0, 0); /* 일일 리셋: 매일 15:00 UTC (한국 00:00) */
      if (nd <= now) nd += 86400000;
      var dow = u.getUTCDay(), nw = Date.UTC(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate() + ((2 - dow + 7) % 7), 8, 0, 0); /* 주간 리셋: 화요일 08:00 UTC (한국 17:00) */
      if (nw <= now) nw += 7 * 86400000;
      var n5 = Date.UTC(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), 8, 0, 0); /* 일일 리셋: 매일 08:00 UTC (한국 17:00) */
      if (n5 <= now) n5 += 86400000;
      var a5 = left(n5 - now);
      if (rd5 && a5 !== lastD5) { rd5.textContent = a5; lastD5 = a5; }
      var a1 = left(nd - now), a2 = left(nw - now);

})();

    qIdx = -1; qDone = false; resetScore();
    qz.classList.remove("done");
    nextQ();
  }
  function newQ() { startRound(); }
  function nextQ() {
    clearTimeout(qTimer);
    qIdx++;
    if (qIdx >= deck.length) { finish(); return; }
    var pool = qPool();
    qCur = deck[qIdx].it; qDir = deck[qIdx].dir;
    var seen = {}; seen[qCur.ko] = 1;
    var wrong = shuffle(pool.slice()).filter(function (x) { if (seen[x.ko]) return false; seen[x.ko] = 1; return true; }).slice(0, 3);
    var opts = shuffle([qCur].concat(wrong));
    var kj = qDir === "kj";
    qHint.textContent = kj ? "이 읽기에 맞는 글자는?" : "이 글자의 읽기는?";
    qChar.textContent = kj ? qCur.ko : qCur.jp;
    qChar.className = "kq-char" + (kj ? " kq-kr" : "");
    var oldConf = qz.querySelector(".kq-confetti"); if (oldConf) oldConf.remove();
    qChar.setAttribute("data-n", Math.min(5, Array.from(kj ? qCur.ko : qCur.jp).length));
    qOpts.innerHTML = ""; qOpts.hidden = false;
    qOpts.className = "kq-opts" + (kj ? " kq-jpo" : "");
    opts.forEach(function (o, i) {
      var b = el("button", "kq-opt"); b.type = "button";
      b.appendChild(el("span", "kq-key", String(i + 1)));
      b.appendChild(el("span", "kq-ko", kj ? o.jp : o.ko));
      b._it = o;
      b.onclick = function () { answer(b, o); };
      qOpts.appendChild(b);
    });
    qAnswered = false; qMsg.textContent = ""; qMsg.className = "kq-msg"; qNext.hidden = true; qRe.hidden = true;
    qStamp.className = "kq-stamp";
    qNext.textContent = "다음 문제 ▶";
    showScore();
    qz.focus();
  }
  function answer(btn, o) {
    if (qAnswered) return;
    qAnswered = true; qTotal++;
    var ok = o === qCur, last = qIdx >= deck.length - 1;
    Array.prototype.forEach.call(qOpts.children, function (b) { b.disabled = true; if (b._it === qCur) b.classList.add("right"); });
    var line = qDir === "kj" ? qCur.ko + " = " + qCur.jp : qCur.jp + " = " + qCur.ko;
    if (qCur.mean) line += " · " + qCur.mean.split(" · ")[0];
    line += " (" + romaji(qCur.jp) + ")";
    if (ok) {
      if (!learned[qCur.jp]) { learned[qCur.jp] = 1; saveLearned(); }
      qRight++; qStreak++; if (qStreak > qBest) { qBest = qStreak; try { localStorage.setItem(STORE + "-best", String(qBest)); } catch (e) {} }
      qMsg.textContent = line; qMsg.className = "kq-msg ok"; stamp(true);
      qTimer = setTimeout(nextQ, 1300);
    } else {
      qStreak = 0; btn.classList.add("wrong");
      qMsg.textContent = "정답은 " + line; qMsg.className = "kq-msg bad"; stamp(false);
      qNext.textContent = last ? "결과 보기 ▶" : "다음 문제 ▶";
      qNext.hidden = false;
    }
    showScore();
  }
  function finish() {
    qDone = true;
    qz.classList.add("done");
    qScore.textContent = "";
    qStamp.className = "kq-stamp";
    qScore.appendChild(el("span", "kq-range", (script === "k" ? "가타카나" : "히라가나") + " · " + rangeName()));
    qScore.appendChild(el("span", "", "테스트 끝!"));
    qScore.appendChild(el("span", "", "최고 연속 " + qBest));
    qHint.textContent = deck.length + "문제 중";
    qChar.className = "kq-char kq-kr"; qChar.setAttribute("data-n", "3");
    qChar.textContent = qRight + "개 정답";
    qOpts.innerHTML = ""; qOpts.hidden = true;
    var pct = deck.length ? Math.round(qRight / deck.length * 100) : 0;
    qMsg.className = "kq-msg " + (pct >= 80 ? "ok" : pct >= 50 ? "" : "bad");
    if (pct === 100 && deck.length) {
      qHint.textContent = "🎉 " + deck.length + "문제 전부 정답";
      qChar.textContent = "축하합니다!";
      qChar.classList.add("kq-party");
      fanfare(); confetti(qChar.parentNode);
    }
    qMsg.textContent = pct === 100 ? "전부 맞혔어요! 완벽해요." : pct >= 80 ? "거의 다 맞혔어요!" : pct >= 50 ? "절반 넘게 맞혔어요. 한 번 더 해볼까요?" : "연습칸에서 조금 더 써보고 다시 도전해요.";
    qNext.textContent = "↻ 다시하기"; qNext.hidden = false; qRe.hidden = false;
    qz.focus();
  }
  function setQuiz(on) {
    quizOn = on;
    stopAnim();
    padEl.hidden = on; grid.hidden = on; secBar.hidden = on; segEl.hidden = on; clearAll.hidden = on;
    explEl.hidden = on || !EXPL[secId];
    titleEl.textContent = on ? "히라가나·가타카나 테스트" : "히라가나·가타카나 쓰기 연습장";
    qz.hidden = !on; qRangeBar.hidden = true;
    testBtn.textContent = on ? "연습으로 돌아가기" : "테스트";
    testBtn.setAttribute("aria-pressed", on ? "true" : "false");
    if (on) { qz.setAttribute("tabindex", "-1"); startRound(); }
    else { clearTimeout(qTimer); if (TTS_OK) window.speechSynthesis.cancel(); renderGrid(false); }
  }
  function open() {
    if (!ov) build();
    document.body.appendChild(ov);
    document.body.style.overflow = "hidden";
    renderGrid(false);
    try { qBest = +localStorage.getItem(STORE + "-best") || 0; } catch (e) {}
    if (quizOn) newQ();
    if (document.fonts && document.fonts.load) document.fonts.load("500 40px \"Zen Kaku Gothic New\"", "あア").then(drawGuide, function () {});
    box.setAttribute("tabindex", "-1"); box.focus();
  }
  function close() {
    stopAnim();
    var pop = box && box.querySelector(".kana-pop"); if (pop) pop.remove();
    if (quizOn) setQuiz(false);
    if (TTS_OK) window.speechSynthesis.cancel();
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
    document.body.style.overflow = "";
    openBtn.focus();
  }
  openBtn.addEventListener("click", open);
})();

(function forceDark() {
  var root = document.documentElement;
  function set() { if (root.getAttribute("data-theme") !== "dark") root.setAttribute("data-theme", "dark"); }
  set();
  try { new MutationObserver(set).observe(root, { attributes: true, attributeFilter: ["data-theme"] }); } catch (e) {}
})();
</script>
